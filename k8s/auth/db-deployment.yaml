apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: quantumshop
spec:
  replicas: 0

  selector:
    matchLabels:
      app: auth-db

  template:
    metadata:
      labels:
        app: auth-db

    spec:
      containers:
        - name: auth-db
          image: postgres:16

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: auth-db-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: auth-db-storage
          persistentVolumeClaim:
            claimName: auth-db-pvc